name: Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.vscode/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'LICENSE'
      - 'README.md'
      - 'assets/**'
      - 'docs/**'
      - 'installer/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'third_party/**'
      - 'tools/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.vscode/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'LICENSE'
      - 'README.md'
      - 'assets/**'
      - 'docs/**'
      - 'installer/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'third_party/**'
      - 'tools/**'

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        shell: pwsh
        run: |
          cmake --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property catalog_productDisplayVersion

      - name: Configure
        shell: pwsh
        run: cmake --preset ci-windows

      - name: Build fast test targets
        shell: pwsh
        run: cmake --build --preset ci-windows --target audiocity_offline_tests audiocity_preset_runtime_smoke audiocity_ui_snapshot_header_smoke audiocity_ui_snapshot_core_smoke

      - name: Run non-UI CTest suite
        shell: pwsh
        run: ctest --preset ci-windows --exclude-regex '^audiocity_ui_snapshot_harness$'

      - name: Build Release wrappers
        shell: pwsh
        run: cmake --build --preset ci-windows-release

      - name: Verify Release resources and compile installer inputs
        shell: pwsh
        run: ./scripts/verify_release_artifacts.ps1 -BuildDir build/ci-windows -Configuration Release -CompileInstaller

      - name: Build Release library-index benchmark
        shell: pwsh
        run: cmake --build build/ci-windows --config Release --target audiocity_offline_tests --parallel 2

      - name: Enforce Release 50k library scan and search budgets
        shell: pwsh
        run: ./build/ci-windows/tests/Release/audiocity_offline_tests.exe --filter LibraryFileIndex50kScanSearchIntegration

      - name: Build Release performance harness
        shell: pwsh
        run: cmake --build build/ci-windows --config Release --target audiocity_engine_profile --parallel 2

      - name: Record render-deadline measurement
        shell: pwsh
        run: ./scripts/check_render_deadline.ps1 -BuildDir build/ci-windows -Configuration Release

      - name: Validate VST3 in pluginval
        shell: pwsh
        run: ./scripts/validate_vst3.ps1 -BuildDir build/ci-windows -Configuration Release -StrictnessLevel 5

      - name: Upload validation and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation
          path: |
            artifacts/installer-validation/**
            artifacts/performance/**
            artifacts/pluginval/logs/**
          if-no-files-found: warn

  coverage-baseline:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake --preset ci-windows

      - name: Build consolidated offline tests
        shell: pwsh
        run: cmake --build --preset ci-windows --target audiocity_offline_tests

      - name: Install native coverage collector
        shell: pwsh
        run: choco install opencppcoverage --version=0.9.9.0 --yes --no-progress

      - name: Report native coverage baseline
        shell: pwsh
        run: ./scripts/report_test_coverage.ps1 -BuildDir build/ci-windows -Configuration Debug

      - name: Upload native coverage baseline
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage
          path: artifacts/coverage/**
